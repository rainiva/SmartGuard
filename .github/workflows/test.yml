name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  run-tests:
    runs-on: windows-latest
    env:
      SMARTGUARD_SKIP_INSTALLER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          choco install ripgrep -y
          rg --version
      - name: Restore and publish desktop suite
        shell: pwsh
        run: |
          . ./scripts/Invoke-SmartGuardDotNetTests.ps1
          $projects = Get-SmartGuardDotNetTestProjectPaths -RepoRoot (Get-Location).Path
          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./build.cmd Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run SmartGuard test suite
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          ./Run-Tests.ps1
